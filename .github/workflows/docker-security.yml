name: Docker Image Security Scanning (Trivy + ZAP DAST)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build Flutter Web, Docker image, and run Trivy CVE scan (unchanged)
  # ─────────────────────────────────────────────────────────────────────────────
  docker-security-scan:
    name: Build Docker Image & Run Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Dependencies
        run: flutter pub get

      - name: 4. Run Unit Tests
        run: flutter test

      - name: 5. Build Flutter Web Application
        run: flutter build web --release

      - name: 6. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 7. Build Docker Image
        run: |
          docker build -t experiment-6-app:latest .
          docker images | grep experiment-6-app

      - name: 8. Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          scan-ref: 'experiment-6-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: false
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: OWASP ZAP DAST scan — detects missing HTTP security headers
  #
  # DELIBERATE VULNERABILITY (for DevSecOps Experiment 7 lab demo):
  #   nginx.conf serves the app with NO security response headers:
  #     - X-Frame-Options      → Clickjacking (CWE-1021)
  #     - X-Content-Type-Options → MIME sniffing (CWE-693)
  #     - Content-Security-Policy → XSS (CWE-693)
  #
  # ZAP baseline scan flags these as Medium-risk alerts and exits non-zero,
  # which blocks this job and simulates a blocked deployment.
  #
  # TO REVERT TO PASS STATE: add these 3 lines inside the server{} block
  # in nginx.conf, then push:
  #   add_header X-Frame-Options "SAMEORIGIN";
  #   add_header X-Content-Type-Options "nosniff";
  #   add_header Content-Security-Policy "default-src 'self'";
  # ─────────────────────────────────────────────────────────────────────────────
  zap-dast-scan:
    name: OWASP ZAP DAST Scan (Security Headers Check)
    runs-on: ubuntu-latest
    needs: docker-security-scan   # only run if build + Trivy pass

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 3. Install Dependencies
        run: flutter pub get

      - name: 4. Build Flutter Web Application
        run: flutter build web --release

      - name: 5. Build Docker Image for DAST
        run: docker build -t experiment-6-app:latest .

      - name: 6. Start Application Container
        run: |
          docker run -d \
            --name target-app \
            -p 8080:8080 \
            experiment-6-app:latest
          # Wait for Nginx to be ready
          echo "Waiting for app to start..."
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "App is up after ${i}s"
              break
            fi
            sleep 1
          done
          curl -v http://localhost:8080/healthz

      - name: 7. Run OWASP ZAP Baseline DAST Scan
        # -t  : target URL
        # -r  : HTML report saved as artifact
        # -I  : do NOT fail on informational alerts  (Medium+ still fails)
        # -l  : minimum alert level to include (MEDIUM → fail on Medium+)
        # --auto-tag-on-success : suppress false-positives in baseline
        run: |
          docker run --network host \
            -v ${{ github.workspace }}/zap-reports:/zap/wrk/:rw \
            --user root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8080 \
              -r zap-report.html \
              -l MEDIUM \
              -I

      - name: 8. Upload ZAP Report as Artifact
        if: always()   # upload even when ZAP fails so you can inspect results
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: zap-reports/zap-report.html

      - name: 9. Stop Application Container
        if: always()
        run: docker stop target-app || true
