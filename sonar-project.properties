# ─────────────────────────────────────────────────────────────────────────────
# SonarCloud / SonarQube — Project Configuration
# DevSecOps Experiment 7
#
# Required GitHub Secrets:
#   SONAR_TOKEN  — generate at https://sonarcloud.io/account/security
#
# Required SonarCloud setup:
#   1. Log in at https://sonarcloud.io with your GitHub account
#   2. Create a new project for this repository
#   3. Copy the projectKey and organization values into this file
#   4. Add SONAR_TOKEN to GitHub repository Settings → Secrets → Actions
# ─────────────────────────────────────────────────────────────────────────────

# Replace these two values with your actual SonarCloud project settings
sonar.projectKey=room-access-request-system
sonar.organization=your-sonarcloud-org

sonar.projectName=Room Access Request System
sonar.projectVersion=1.0

# ─── Source configuration ────────────────────────────────────────────────────
# Analyse the Python Flask API only (the Flutter app uses Dart which
# SonarCloud does not natively support in free tier)
sonar.sources=api
sonar.exclusions=api/tests/**,api/__pycache__/**

# ─── Test configuration ──────────────────────────────────────────────────────
sonar.tests=api/tests
sonar.python.coverage.reportPaths=coverage.xml

# ─── Language ────────────────────────────────────────────────────────────────
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# ─── Quality gate ────────────────────────────────────────────────────────────
# The default SonarCloud quality gate checks:
#   Bugs, Vulnerabilities, Security Hotspots, Code Smells, Coverage
# SonarQube will flag the XSS vulnerability in app.py as a Security Hotspot
# (rule: python:S5131 — Endpoints should not reflect user-supplied data)
